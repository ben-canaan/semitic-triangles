[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Send the www address to the main domain.
[[redirects]]
  from = "https://www.semitictriangles.com/*"
  to = "https://semitictriangles.com/:splat"
  status = 301
  force = true

# Single-page app: every path serves the game.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Let the service worker update promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
