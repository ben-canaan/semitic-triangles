[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path serves the game.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Let the service worker update promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
